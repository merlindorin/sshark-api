apiVersion: v2
name: sshark-api
description: SSHark API - SSH public key lookup service that fetches and caches SSH keys from GitHub and GitLab
type: application
version: 0.3.10
appVersion: "v0.3.10"
keywords:
  - ssh
  - github
  - gitlab
  - api
  - security
home: https://github.com/merlindorin/sshark
maintainers:
  - name: merlindorin
dependencies:
  - name: redis-stack
    version: 0.4.21
    repository: https://redis-stack.github.io/helm-redis-stack/
    condition: redis-stack.enabled