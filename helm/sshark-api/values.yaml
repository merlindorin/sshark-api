replicaCount: 1

image:
  repository: ghcr.io/merlindorin/sshark-api
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# PostgreSQL connection configuration
# When cnpg.enabled is true, these values are auto-configured
postgres:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: ""
  database: "sshark"
  sslMode: "disable"
  maxConns: 10
  minConns: 2
  # Use existing secret for PostgreSQL password (recommended for production)
  existingSecret: ""
  existingSecretPasswordKey: "postgres-password"

# CloudNativePG cluster configuration
# Creates a PostgreSQL cluster using CloudNativePG operator
cnpg:
  # Enable CloudNativePG cluster creation
  enabled: false
  # Number of PostgreSQL instances
  instances: 1
  # PostgreSQL image (optional, uses operator default if not set)
  imageName: ""
  # Database name
  database: "sshark"
  # Database owner
  owner: "sshark"
  # PostgreSQL parameters
  parameters:
    max_connections: "100"
    shared_buffers: "256MB"
  # Post-init SQL statements
  postInitSQL: []
  # Storage configuration
  storage:
    size: "1Gi"
    storageClass: ""
  # Resource limits
  resources: {}
  #   requests:
  #     memory: "512Mi"
  #     cpu: "100m"
  #   limits:
  #     memory: "1Gi"
  #     cpu: "500m"
  # Backup configuration
  backup:
    enabled: false
    destinationPath: ""
    endpointURL: ""
    s3Credentials:
      secretName: ""
      accessKeyIdKey: "ACCESS_KEY_ID"
      secretAccessKeyKey: "SECRET_ACCESS_KEY"
    wal:
      compression: "gzip"
    retentionPolicy: "30d"
  # Monitoring configuration
  monitoring:
    enabled: false
    enablePodMonitor: true

# Migration configuration
migration:
  # Enable pre-install/pre-upgrade migration hook
  enabled: true
  # Path to migrations directory in the container
  migrationsPath: "db/migrations"

# Clerk authentication configuration
clerk:
  # Clerk secret key (for development only, use existingSecret in production)
  token: ""
  # Use existing secret for Clerk token (recommended for production)
  existingSecret: ""
  existingSecretKey: "clerk-token"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

metrics:
  enabled: true
  port: 8080
  path: /metrics
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: sshark-api.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /liveness
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /readiness
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

# Scraper configuration (continuous service)
scraper:
  # Enable scraper deployment
  enabled: false
  # Provider to scrape (github, gitlab)
  provider: "github"
  # Number of users to fetch per batch
  batchSize: 100
  # Delay between batches (Go duration format: 1s, 500ms, etc.)
  delay: "1m"
  # GitHub API token (use existingSecret in production)
  githubToken: ""
  # GitLab API token (use existingSecret in production)
  gitlabToken: ""
  # Use existing secret for API tokens
  existingSecret: ""
  existingSecretGithubKey: "github-token"
  existingSecretGitlabKey: "gitlab-token"
  # Resource limits for scraper
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Grafana dashboard configuration (for grafana-operator)
grafana:
  dashboard:
    enabled: false
    datasourceUID: ""
    instanceSelector:
      matchLabels:
        dashboards: "grafana"
    folderName: ""
