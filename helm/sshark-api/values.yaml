replicaCount: 1

image:
  repository: ghcr.io/merlindorin/sshark-api
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# PostgreSQL connection configuration
postgres:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: ""
  database: "sshark"
  sslMode: "disable"
  maxConns: 10
  minConns: 2
  # Use existing secret for PostgreSQL password (recommended for production)
  existingSecret: ""
  existingSecretPasswordKey: "postgres-password"

# Migration configuration
migration:
  # Enable pre-install/pre-upgrade migration hook
  enabled: true
  # Path to migrations directory in the container
  migrationsPath: "db/migrations"

# Clerk authentication configuration
clerk:
  # Clerk secret key (for development only, use existingSecret in production)
  token: ""
  # Use existing secret for Clerk token (recommended for production)
  existingSecret: ""
  existingSecretKey: "clerk-token"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

metrics:
  enabled: true
  port: 8080
  path: /metrics
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: sshark-api.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /liveness
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /readiness
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

# Scraper configuration (continuous service)
scraper:
  # Enable scraper deployment
  enabled: false
  # Provider to scrape (github, gitlab)
  provider: "github"
  # Number of users to fetch per batch
  batchSize: 100
  # Delay between batches in milliseconds
  delay: 1000
  # GitHub API token (use existingSecret in production)
  githubToken: ""
  # GitLab API token (use existingSecret in production)
  gitlabToken: ""
  # Use existing secret for API tokens
  existingSecret: ""
  existingSecretGithubKey: "github-token"
  existingSecretGitlabKey: "gitlab-token"
  # Resource limits for scraper
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Grafana dashboard configuration (for grafana-operator)
grafana:
  dashboard:
    enabled: false
    datasourceUID: ""
    instanceSelector:
      matchLabels:
        dashboards: "grafana"
    folderName: ""
