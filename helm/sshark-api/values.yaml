replicaCount: 1

image:
  repository: ghcr.io/merlindorin/sshark-api
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Redis Stack subchart configuration
# WARNING: The redis-stack subchart does NOT support persistence by default.
# Data will be lost on pod restart. For production, either:
# 1. Use an external Redis with persistence (set redis-stack.enabled: false and configure redis.host)
# 2. Add your own PVC and volumeMounts to the redis-stack deployment
redis-stack:
  enabled: true

# Dragonfly configuration (alternative to redis-stack)
# Requires dragonfly-operator to be installed in the cluster
# See: https://github.com/dragonflydb/dragonfly-operator
dragonfly:
  enabled: false
  # Number of Dragonfly replicas
  replicas: 1
  # Resource requests and limits
  resources:
    requests:
      cpu: 500m
      memory: 500Mi
    limits:
      cpu: 600m
      memory: 750Mi
  # Storage configuration for persistence
  storage:
    # Enable persistent storage (uses auto-provisioned PVC)
    enabled: true
    # Storage size for the PVC
    size: 1Gi
    # Storage class name (leave empty to use default)
    storageClassName: ""
    # Use an existing PVC instead of creating one
    existingPersistentVolumeClaimName: ""
  # Scheduled snapshot configuration (optional)
  snapshot:
    # Enable periodic snapshots
    enabled: false
    # Cron schedule for snapshots (e.g., "0 */6 * * *" for every 6 hours)
    cron: ""
  # Additional arguments to pass to Dragonfly
  args: []
  # Skip assigning FSGroup to the pod security context
  skipFSGroup: false
  # Annotations to add to the Dragonfly resource
  annotations: {}
  # Node selector for Dragonfly pods
  nodeSelector: {}

# Redis connection configuration
# When redis-stack.enabled is true, host is auto-configured to the subchart service
# When dragonfly.enabled is true, host is auto-configured to the dragonfly service
redis:
  # Only used when redis-stack.enabled and dragonfly.enabled are both false
  host: ""
  port: 6379
  password: ""
  db: 0
  # Set to true to force recreating the search index on startup
  # This only rebuilds the index, not the underlying data
  forceReindex: false
  existingSecret: ""
  existingSecretPasswordKey: "redis-password"

# Clerk authentication configuration
clerk:
  # Clerk secret key (for development only, use existingSecret in production)
  token: ""
  # Use existing secret for Clerk token (recommended for production)
  existingSecret: ""
  existingSecretKey: "clerk-token"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: sshark-api.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /liveness
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /readiness
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

# Multi-provider scraper configuration
# Each provider can have its own scraper deployment
scrapers:
  github:
    enabled: false
    rateLimit: 2.0
    batchSize: 100
    podAnnotations: {}
    podLabels: {}
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
    nodeSelector: {}
    tolerations: []
    affinity: {}

  gitlab:
    enabled: false
    rateLimit: 1.0
    batchSize: 100
    # GitLab API token (required if enabled)
    # If set, a secret will be automatically created.
    # For production, use existingSecret instead.
    token: ""
    # Use existing secret for GitLab token (recommended for production)
    # When using existingSecret, the token field above is ignored
    existingSecret: ""
    existingSecretKey: "gitlab-token"
    podAnnotations: {}
    podLabels: {}
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
    nodeSelector: {}
    tolerations: []
    affinity: {}