apiVersion: v1
kind: Service
metadata:
  name: {{ include "sshark-api.fullname" . }}
  labels:
    {{- include "sshark-api.labels" . | nindent 4 }}
  {{- if .Values.metrics.enabled }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: {{ .Values.metrics.path }}
    prometheus.io/port: {{ .Values.service.port | quote }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "sshark-api.selectorLabels" . | nindent 4 }}
