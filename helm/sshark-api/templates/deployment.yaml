apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sshark-api.fullname" . }}
  labels:
    {{- include "sshark-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sshark-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/path: {{ .Values.metrics.path }}
        prometheus.io/port: "8080"
        metrics.grafana.com/scrape: "true"
        metrics.grafana.com/path: {{ .Values.metrics.path }}
        metrics.grafana.com/port: "8080"
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "sshark-api.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "sshark-api.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
          env:
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            {{- if .Values.cnpg.enabled }}
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ include "sshark-api.fullname" . }}-pg-app
                  key: host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ include "sshark-api.fullname" . }}-pg-app
                  key: port
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "sshark-api.fullname" . }}-pg-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sshark-api.fullname" . }}-pg-app
                  key: password
            - name: POSTGRES_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "sshark-api.fullname" . }}-pg-app
                  key: dbname
            - name: POSTGRES_SSL_MODE
              value: "require"
            {{- else }}
            - name: POSTGRES_HOST
              value: {{ .Values.postgres.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_DATABASE
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_SSL_MODE
              value: {{ .Values.postgres.sslMode | quote }}
            {{- if .Values.postgres.existingSecret }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: {{ .Values.postgres.existingSecretPasswordKey }}
            {{- else if .Values.postgres.password }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            {{- end }}
            {{- end }}
            - name: POSTGRES_MAX_CONNS
              value: {{ .Values.postgres.maxConns | quote }}
            - name: POSTGRES_MIN_CONNS
              value: {{ .Values.postgres.minConns | quote }}
            {{- if or .Values.clerk.token .Values.clerk.existingSecret }}
            - name: CLERK_TOKEN
              valueFrom:
                secretKeyRef:
                  {{- if .Values.clerk.existingSecret }}
                  name: {{ .Values.clerk.existingSecret }}
                  key: {{ .Values.clerk.existingSecretKey }}
                  {{- else }}
                  name: {{ include "sshark-api.fullname" . }}-clerk-token
                  key: clerk-token
                  {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
