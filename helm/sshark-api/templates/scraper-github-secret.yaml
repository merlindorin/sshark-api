{{- $githubConfig := .Values.scrapers.github }}
{{- if and $githubConfig.enabled $githubConfig.token (not $githubConfig.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sshark-api.fullname" . }}-github-token
  labels:
    {{- include "sshark-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: scraper
    app.kubernetes.io/provider: github
type: Opaque
stringData:
  github-token: {{ $githubConfig.token | quote }}
{{- end }}
