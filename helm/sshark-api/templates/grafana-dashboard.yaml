{{- if .Values.grafana.dashboard.enabled }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ include "sshark-api.fullname" . }}
  labels:
    {{- include "sshark-api.labels" . | nindent 4 }}
spec:
  allowCrossNamespaceImport: true
  {{- with .Values.grafana.dashboard.instanceSelector }}
  instanceSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.grafana.dashboard.folderName }}
  folderName: {{ . }}
  {{- end }}
  json: |
    {
      "title": "SSHark API Overview",
      "uid": "sshark-api-overview",
      "tags": ["sshark", "api"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Request Rate",
          "type": "graph",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "datasource": {
            "type": "prometheus",
            "uid": "{{ .Values.grafana.dashboard.datasourceUID }}"
          },
          "targets": [
            {
              "expr": "sum(rate(api_requests_total[$__rate_interval]))",
              "legendFormat": "Total Requests/sec",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "yaxes": [
            {"format": "reqps", "logBase": 1, "min": 0, "show": true},
            {"format": "short", "logBase": 1, "show": true}
          ]
        },
        {
          "id": 2,
          "title": "Auth Success Rate",
          "type": "graph",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "datasource": {
            "type": "prometheus",
            "uid": "{{ .Values.grafana.dashboard.datasourceUID }}"
          },
          "targets": [
            {
              "expr": "sum(rate(api_auth_attempts_total{result=\"success\"}[$__rate_interval])) / sum(rate(api_auth_attempts_total[$__rate_interval]))",
              "legendFormat": "Success Rate",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1
            }
          },
          "yaxes": [
            {"format": "percentunit", "logBase": 1, "min": 0, "max": 1, "show": true},
            {"format": "short", "logBase": 1, "show": true}
          ]
        },
        {
          "id": 3,
          "title": "Database Connections",
          "type": "graph",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "datasource": {
            "type": "prometheus",
            "uid": "{{ .Values.grafana.dashboard.datasourceUID }}"
          },
          "targets": [
            {
              "expr": "db_connections_active",
              "legendFormat": "Active",
              "refId": "A"
            },
            {
              "expr": "db_connections_idle",
              "legendFormat": "Idle",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "yaxes": [
            {"format": "short", "logBase": 1, "min": 0, "show": true},
            {"format": "short", "logBase": 1, "show": true}
          ]
        },
        {
          "id": 4,
          "title": "Job Queue Status",
          "type": "graph",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "datasource": {
            "type": "prometheus",
            "uid": "{{ .Values.grafana.dashboard.datasourceUID }}"
          },
          "targets": [
            {
              "expr": "job_queue_depth",
              "legendFormat": "Queue Depth",
              "refId": "A"
            },
            {
              "expr": "job_workers_active",
              "legendFormat": "Active Workers",
              "refId": "B"
            },
            {
              "expr": "job_workers_total",
              "legendFormat": "Total Workers",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "yaxes": [
            {"format": "short", "logBase": 1, "min": 0, "show": true},
            {"format": "short", "logBase": 1, "show": true}
          ]
        },
        {
          "id": 5,
          "title": "Request Rate by Endpoint",
          "type": "graph",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "datasource": {
            "type": "prometheus",
            "uid": "{{ .Values.grafana.dashboard.datasourceUID }}"
          },
          "targets": [
            {
              "expr": "sum by (endpoint, method) (rate(api_requests_total[$__rate_interval]))",
              "legendFormat": "{{`{{method}}`}} {{`{{endpoint}}`}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "yaxes": [
            {"format": "reqps", "logBase": 1, "min": 0, "show": true},
            {"format": "short", "logBase": 1, "show": true}
          ]
        },
        {
          "id": 6,
          "title": "Response Time (p50, p95, p99)",
          "type": "graph",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "datasource": {
            "type": "prometheus",
            "uid": "{{ .Values.grafana.dashboard.datasourceUID }}"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le) (rate(api_request_duration_seconds_bucket[$__rate_interval])))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(api_request_duration_seconds_bucket[$__rate_interval])))",
              "legendFormat": "p95",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(api_request_duration_seconds_bucket[$__rate_interval])))",
              "legendFormat": "p99",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          },
          "yaxes": [
            {"format": "s", "logBase": 1, "min": 0, "show": true},
            {"format": "short", "logBase": 1, "show": true}
          ]
        },
        {
          "id": 7,
          "title": "Request Rate by Status Code",
          "type": "graph",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 24},
          "datasource": {
            "type": "prometheus",
            "uid": "{{ .Values.grafana.dashboard.datasourceUID }}"
          },
          "targets": [
            {
              "expr": "sum by (status) (rate(api_requests_total[$__rate_interval]))",
              "legendFormat": "{{`{{status}}`}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "yaxes": [
            {"format": "reqps", "logBase": 1, "min": 0, "show": true},
            {"format": "short", "logBase": 1, "show": true}
          ]
        },
        {
          "id": 8,
          "title": "DB Connection Wait Time (p50, p95)",
          "type": "graph",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 24},
          "datasource": {
            "type": "prometheus",
            "uid": "{{ .Values.grafana.dashboard.datasourceUID }}"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le) (rate(db_connection_wait_time_seconds_bucket[$__rate_interval])))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(db_connection_wait_time_seconds_bucket[$__rate_interval])))",
              "legendFormat": "p95",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          },
          "yaxes": [
            {"format": "s", "logBase": 1, "min": 0, "show": true},
            {"format": "short", "logBase": 1, "show": true}
          ]
        },
        {
          "id": 9,
          "title": "Scraping Request Rate",
          "type": "graph",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 32},
          "datasource": {
            "type": "prometheus",
            "uid": "{{ .Values.grafana.dashboard.datasourceUID }}"
          },
          "targets": [
            {
              "expr": "sum by (provider, status) (rate(scraping_requests_total[$__rate_interval]))",
              "legendFormat": "{{`{{provider}}`}} - {{`{{status}}`}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "yaxes": [
            {"format": "reqps", "logBase": 1, "min": 0, "show": true},
            {"format": "short", "logBase": 1, "show": true}
          ]
        },
        {
          "id": 10,
          "title": "Scraping Duration by Provider",
          "type": "graph",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 32},
          "datasource": {
            "type": "prometheus",
            "uid": "{{ .Values.grafana.dashboard.datasourceUID }}"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le, provider) (rate(scraping_duration_seconds_bucket[$__rate_interval])))",
              "legendFormat": "{{`{{provider}}`}} p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le, provider) (rate(scraping_duration_seconds_bucket[$__rate_interval])))",
              "legendFormat": "{{`{{provider}}`}} p95",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          },
          "yaxes": [
            {"format": "s", "logBase": 1, "min": 0, "show": true},
            {"format": "short", "logBase": 1, "show": true}
          ]
        },
        {
          "id": 11,
          "title": "Keys Discovered Rate",
          "type": "graph",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 40},
          "datasource": {
            "type": "prometheus",
            "uid": "{{ .Values.grafana.dashboard.datasourceUID }}"
          },
          "targets": [
            {
              "expr": "sum by (provider) (rate(scraping_keys_discovered_total[$__rate_interval]))",
              "legendFormat": "{{`{{provider}}`}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "keys/s"
            }
          },
          "yaxes": [
            {"format": "ops", "logBase": 1, "min": 0, "show": true},
            {"format": "short", "logBase": 1, "show": true}
          ]
        },
        {
          "id": 12,
          "title": "User Operations",
          "type": "graph",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 40},
          "datasource": {
            "type": "prometheus",
            "uid": "{{ .Values.grafana.dashboard.datasourceUID }}"
          },
          "targets": [
            {
              "expr": "sum by (operation_type) (rate(api_user_operations_total[$__rate_interval]))",
              "legendFormat": "{{`{{operation_type}}`}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            }
          },
          "yaxes": [
            {"format": "ops", "logBase": 1, "min": 0, "show": true},
            {"format": "short", "logBase": 1, "show": true}
          ]
        }
      ]
    }
{{- end }}
