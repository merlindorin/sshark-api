{{- range $provider, $config := .Values.scrapers }}
{{- if $config.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sshark-api.fullname" $ }}-scraper-{{ $provider }}
  labels:
    {{- include "sshark-api.labels" $ | nindent 4 }}
    app.kubernetes.io/component: scraper
    app.kubernetes.io/provider: {{ $provider }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "sshark-api.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: scraper
      app.kubernetes.io/provider: {{ $provider }}
  template:
    metadata:
      {{- with $config.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "sshark-api.labels" $ | nindent 8 }}
        app.kubernetes.io/component: scraper
        app.kubernetes.io/provider: {{ $provider }}
        {{- with $config.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "sshark-api.serviceAccountName" $ }}
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $.Chart.Name }}-scraper-{{ $provider }}
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args:
            - scrape
            - --provider
            - {{ $provider }}
            - --rate-limit
            - {{ $config.rateLimit | quote }}
            - --batch-size
            - {{ $config.batchSize | quote }}
          env:
            - name: REDIS_HOST
              {{- if $.Values.dragonfly.enabled }}
              value: "{{ include "sshark-api.fullname" $ }}-dragonfly"
              {{- else if index $.Values "redis-stack" "enabled" }}
              value: "redis-stack"
              {{- else }}
              value: {{ $.Values.redis.host | quote }}
              {{- end }}
            - name: REDIS_PORT
              value: {{ $.Values.redis.port | quote }}
            - name: REDIS_DB
              value: {{ $.Values.redis.db | quote }}
            {{- if $.Values.redis.existingSecret }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.redis.existingSecret }}
                  key: {{ $.Values.redis.existingSecretPasswordKey }}
            {{- else if $.Values.redis.password }}
            - name: REDIS_PASSWORD
              value: {{ $.Values.redis.password | quote }}
            {{- end }}
            {{- if eq $provider "gitlab" }}
            - name: GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  {{- if $config.existingSecret }}
                  name: {{ $config.existingSecret }}
                  key: {{ $config.existingSecretKey }}
                  {{- else }}
                  name: {{ include "sshark-api.fullname" $ }}-gitlab-token
                  key: gitlab-token
                  {{- end }}
            {{- end }}
          {{- with $config.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $.Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $config.nodeSelector }}
      nodeSelector:
        {{- toYaml $config.nodeSelector | nindent 8 }}
      {{- else if $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml $.Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- with $config.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $config.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
