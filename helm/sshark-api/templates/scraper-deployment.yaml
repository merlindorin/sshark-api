{{- if .Values.scraper.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sshark-api.fullname" . }}-scraper
  labels:
    {{- include "sshark-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: scraper
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "sshark-api.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scraper
  template:
    metadata:
      labels:
        {{- include "sshark-api.labels" . | nindent 8 }}
        app.kubernetes.io/component: scraper
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "sshark-api.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: scraper
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - scrape
            - --provider={{ .Values.scraper.provider }}
            - --batch-size={{ .Values.scraper.batchSize }}
            - --delay={{ .Values.scraper.delay }}
          env:
            - name: POSTGRES_HOST
              value: {{ .Values.postgres.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_DATABASE
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_SSL_MODE
              value: {{ .Values.postgres.sslMode | quote }}
            {{- if .Values.postgres.existingSecret }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: {{ .Values.postgres.existingSecretPasswordKey }}
            {{- else if .Values.postgres.password }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            {{- end }}
            {{- if .Values.scraper.existingSecret }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.scraper.existingSecret }}
                  key: {{ .Values.scraper.existingSecretGithubKey }}
                  optional: true
            - name: GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.scraper.existingSecret }}
                  key: {{ .Values.scraper.existingSecretGitlabKey }}
                  optional: true
            {{- else }}
            {{- if .Values.scraper.githubToken }}
            - name: GITHUB_TOKEN
              value: {{ .Values.scraper.githubToken | quote }}
            {{- end }}
            {{- if .Values.scraper.gitlabToken }}
            - name: GITLAB_TOKEN
              value: {{ .Values.scraper.gitlabToken | quote }}
            {{- end }}
            {{- end }}
          {{- with .Values.scraper.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
