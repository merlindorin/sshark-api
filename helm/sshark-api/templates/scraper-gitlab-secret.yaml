{{- $gitlabConfig := .Values.scrapers.gitlab }}
{{- if and $gitlabConfig.enabled $gitlabConfig.token (not $gitlabConfig.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sshark-api.fullname" . }}-gitlab-token
  labels:
    {{- include "sshark-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: scraper
    app.kubernetes.io/provider: gitlab
type: Opaque
stringData:
  gitlab-token: {{ $gitlabConfig.token | quote }}
{{- end }}
