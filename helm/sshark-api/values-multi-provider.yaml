# Example values for multi-provider scraping setup
# Install with: helm install sshark-api . -f values-multi-provider.yaml

# Enable both GitHub and GitLab scrapers
scrapers:
  github:
    enabled: true
    rateLimit: 2.0
    batchSize: 100
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi

  gitlab:
    enabled: true
    rateLimit: 5.0
    batchSize: 100
    # Option 1: Use existing secret (recommended for production)
    existingSecret: "gitlab-token"
    existingSecretKey: "gitlab-token"
    # Option 2: Set token directly (development only, not recommended)
    # token: "glpat-xxxxxxxxxxxxxxxxxxxx"
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi

# Use persistent storage for Redis (recommended for production)
redis-stack:
  enabled: false

dragonfly:
  enabled: true
  replicas: 1
  storage:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 500m
      memory: 500Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# API server configuration
replicaCount: 2

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# Enable ingress for external access
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: sshark.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: sshark-tls
      hosts:
        - sshark.example.com
